let currentLang = 'en';
let currentCat = 'notice';
function setLang(lang, el) {
currentLang = lang;
document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
el.classList.add('active');
render();
}
function setCat(cat, el) {
currentCat = cat;
document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
el.classList.add('active');
render();
window.scrollTo({top:0, behavior:'smooth'});
}
function render() {
const cat = CATS[currentCat];
let html = '';
cat.images.forEach(src => {
html += <img class="menu-img" src="${src}" alt="menu" loading="lazy">;
});
if (cat.items) {
cat.items.forEach(item => {
html += renderItem(item);
});
}
if (cat.sections) {
cat.sections.forEach(sec => {
html += <div class="sec-title">${sec.title[currentLang]}</div>;
sec.items.forEach(item => {
html += renderItem(item);
});
});
}
document.getElementById('mainContent').innerHTML = html;
}
function renderItem(item) {
const t = item.t[currentLang];
const desc = t[1] ? <div class="item-desc">${t[1]}</div> : '';
const badge = item.popular ? '<div class="badge">⭐ POPULAR</div>' : '';
return      <div class="item">       <div class="item-info">         ${badge}         <div class="item-orig">${item.original}</div>         <div class="item-name">${t[0]}</div>         ${desc}       </div>       <div class="price">${item.price}</div>     </div>;
}
render();
