let currentLang = 'en';

function setLang(lang, el) {
  currentLang = lang;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderMenu();
}

function renderMenu() {
  const section = document.getElementById('menuSection');
  section.innerHTML = menuData.map(item => {
    const t = item.translations[currentLang];
    return `
      <div class="menu-item">
        <div class="item-info">
          ${item.popular ? '<div class="popular-badge">⭐ POPULAR</div>' : ''}
          <div class="item-original">${item.original}</div>
          <div class="item-name">${t.name}</div>
          <div class="item-desc">${t.desc}</div>
          ${item.note ? `<div class="item-note">${item.note}</div>` : ''}
        </div>
        <div class="item-price">${item.price}</div>
      </div>
    `;
  }).join('');
}

renderMenu();
