let currentLang = 'en';
let currentCat = 'notice';

function setLang(lang, el) {
  currentLang = lang;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  render();
}

function setCat(cat, el) {
  currentCat = cat;
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

function render() {
  const cat = CATS[currentCat];
  if (!cat) return;
  let html = '';
  if (cat.images) {
    cat.images.forEach(src => {
      html += `<img class="menu-img" src="${src}" alt="menu" loading="lazy">`;
    });
  }
  if (cat.items) {
    cat.items.forEach(item => { html += renderItem(item); });
  }
  if (cat.sections) {
    cat.sections.forEach(sec => {
      const title = sec.title[currentLang] || sec.title['en'];
      html += `<div class="sec-title">${title}</div>`;
      sec.items.forEach(item => { html += renderItem(item); });
    });
  }
  document.getElementById('mainContent').innerHTML = html;
}

function renderItem(item) {
  const langData = item.t[currentLang] || item.t['en'] || ["Item", ""];
  const desc = langData[1] ? `<div class="item-desc">${langData[1]}</div>` : '';
  const badge = item.popular ? `<div class="badge">⭐ POPULAR</div>` : '';
  return `
    <div class="item">
      <div class="item-info">
        ${badge}
        <div class="item-orig">${item.original}</div>
        <div class="item-name">${langData[0]}</div>
        ${desc}
      </div>
      <div class="price">${item.price}</div>
    </div>`;
}

function autoDetectLanguage() {
  const nav = navigator.language.toLowerCase();
  if (nav.includes('zh')) currentLang = 'zh';
  else if (nav.includes('ja')) currentLang = 'jp';
  else if (nav.includes('ko')) currentLang = 'kr';
  else if (nav.includes('th')) currentLang = 'th';
  else if (nav.includes('fr')) currentLang = 'fr';
  else if (nav.includes('es')) currentLang = 'es';
  else if (nav.includes('de')) currentLang = 'de';
  else currentLang = 'en';
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('onclick').includes(`'${currentLang}'`));
  });
}

window.addEventListener('DOMContentLoaded', () => {
  autoDetectLanguage();
  render();
});
