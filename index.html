<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>照片菜單翻譯 Pro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f2f5; min-height: 100vh; padding: 24px 16px; color: #1a1a1a;
    }
    .container { max-width: 640px; margin: 0 auto; }
    h1 { font-size: 24px; font-weight: 600; text-align: center; margin-bottom: 6px; }
    
    .subtitle { font-size: 14px; color: #888; text-align: center; margin-bottom: 24px; }
    .lang-section { margin-bottom: 20px; }
    .lang-label { font-size: 13px; color: #666; margin-bottom: 8px; }
    .lang-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .lang-btn {
      padding: 10px 4px; border: 1.5px solid #ddd; border-radius: 12px;
      background: #fff; font-size: 12px; cursor: pointer; text-align: center;
      transition: all 0.15s; color: #333; display: flex; flex-direction: column; align-items: center;
    }
    .lang-btn.active { border-color: #2563eb; background: #eff6ff; color: #2563eb; font-weight: 600; }
    .flag { font-size: 20px; margin-bottom: 2px; }
    .canvas-container {
      background: #fff; border: 2px dashed #ccc; border-radius: 16px;
      position: relative; margin-bottom: 16px; cursor: pointer;
      overflow: hidden; display: flex; justify-content: center; align-items: center;
      transition: border-color 0.15s;
    }
    .canvas-container:hover { border-color: #2563eb; }
    .canvas-container.has-image { border-style: solid; border-color: #2563eb; }
    #placeholder { padding: 48px; text-align: center; color: #888; }
    #translatedCanvas { max-width: 100%; height: auto; display: none; border-radius: 14px; }
    #fileInput { display: none; }
    .translate-btn {
      width: 100%; padding: 16px; background: #2563eb; color: #fff;
      border: none; border-radius: 14px; font-size: 16px; font-weight: 600;
      cursor: pointer; transition: background 0.15s; margin-bottom: 16px;
    }
    .translate-btn:disabled { background: #93c5fd; cursor: not-allowed; }
    .loading { text-align: center; padding: 24px; color: #666; display: none; }
    .loading.show { display: block; }
    .spinner {
      width: 28px; height: 28px; border: 3px solid #e5e7eb;
      border-top-color: #2563eb; border-radius: 50%;
      animation: spin 0.8s linear infinite; margin: 0 auto 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-msg {
      background: #fef2f2; color: #dc2626; padding: 12px 16px;
      border-radius: 10px; font-size: 13px; margin-bottom: 12px; display: none;
    }
    .hint-msg {
      background: #eff6ff; color: #1e40af; padding: 12px 16px;
      border-radius: 10px; font-size: 13px; margin-bottom: 16px; text-align: center; display: none;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>🍽️ 照片菜單翻譯</h1>
  <p class="subtitle">將翻譯文字直接合在照片上</p>

  <div class="lang-section">
    <p class="lang-label">選擇翻譯語言 / Select Language</p>
    <div class="lang-grid">
      <button class="lang-btn active" data-lang="English"><span class="flag">🇺🇸</span>English</button>
      <button class="lang-btn" data-lang="日本語"><span class="flag">🇯🇵</span>日本語</button>
      <button class="lang-btn" data-lang="한국어"><span class="flag">🇰🇷</span>한국어</button>
      <button class="lang-btn" data-lang="繁體中文"><span class="flag">🇹🇼</span>繁體中文</button>
      <button class="lang-btn" data-lang="Français"><span class="flag">🇫🇷</span>Français</button>
      <button class="lang-btn" data-lang="Español"><span class="flag">🇪🇸</span>Español</button>
      <button class="lang-btn" data-lang="Deutsch"><span class="flag">🇩🇪</span>Deutsch</button>
      <button class="lang-btn" data-lang="ภาษาไทย"><span class="flag">🇹🇭</span>ภาษาไทย</button>
    </div>
  </div>

  <div class="canvas-container" id="photoArea" onclick="document.getElementById('fileInput').click()">
    <div id="placeholder">
      <p style="font-size:48px">📷</p>
      <p style="margin-top:12px">點此拍照或選擇圖片</p>
      <p style="font-size:12px;color:#aaa;margin-top:4px">Tap to take a photo or choose image</p>
    </div>
    <canvas id="translatedCanvas"></canvas>
  </div>
  <input type="file" id="fileInput" accept="image/*" capture="environment" />

  <div class="error-msg" id="errorMsg"></div>
  <div class="hint-msg" id="hintMsg">📥 長按圖片可儲存翻譯結果</div>

  <button class="translate-btn" id="translateBtn" onclick="startTranslation()" disabled>
    開始翻譯 / Translate
  </button>

  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p id="loadingText">AI 辨識中...</p>
  </div>
</div>

<script>
  const API_KEY = "AIzaSyDfF2Rzbl-j4rd1SU2SjEd9nBTqwNM_Jlg";

  let selectedLang = "English";
  let imageBase64 = "";
  let originalImage = null;

  document.querySelectorAll(".lang-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".lang-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      selectedLang = btn.dataset.lang;
    });
  });

  document.getElementById("fileInput").addEventListener("change", function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      imageBase64 = e.target.result.split(",")[1];
      originalImage = new Image();
      originalImage.onload = function() {
        renderOriginalOnCanvas();
        document.getElementById("placeholder").style.display = "none";
        document.getElementById("photoArea").classList.add("has-image");
        document.getElementById("translateBtn").disabled = false;
        document.getElementById("hintMsg").style.display = "none";
        document.getElementById("errorMsg").style.display = "none";
      };
      originalImage.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });

  function renderOriginalOnCanvas() {
    const canvas = document.getElementById("translatedCanvas");
    const ctx = canvas.getContext("2d");
    canvas.width = originalImage.width;
    canvas.height = originalImage.height;
    ctx.drawImage(originalImage, 0, 0);
    canvas.style.display = "block";
  }

  async function callGemini(modelName) {
    const prompt = `你是一位專業的餐廳菜單翻譯助手。請分析這張菜單圖片，找出所有菜色名稱，並翻譯成「${selectedLang}」。
你的回應必須是 JSON 格式，每個物件包含：
- box：菜名在圖片中的位置 [ymin, xmin, ymax, xmax]，數值是相對於圖片寬高的 0-1000 整數
- translated：翻譯後的菜名

嚴格回傳以下格式，不要有其他文字：
{"items":[{"box":[ymin,xmin,ymax,xmax],"translated":"翻譯後的菜名（${selectedLang}）"}]}`;

    const response = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${API_KEY}`,
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{
            parts: [
              { text: prompt },
              { inline_data: { mime_type: "image/jpeg", data: imageBase64 } }
            ]
          }],
          generationConfig: { temperature: 0.1 }
        })
      }
    );
    return response;
  }

  async function startTranslation() {
    const btn = document.getElementById("translateBtn");
    const loading = document.getElementById("loading");
    const loadingText = document.getElementById("loadingText");
    const errorMsg = document.getElementById("errorMsg");
    const hintMsg = document.getElementById("hintMsg");

    btn.disabled = true;
    loading.classList.add("show");
    errorMsg.style.display = "none";
    hintMsg.style.display = "none";
    renderOriginalOnCanvas();

    try {
      loadingText.textContent = "Gemini 2.5 辨識座標與翻譯中...";
      let response = await callGemini("gemini-2.5-flash");

      if (!response.ok) {
        loadingText.textContent = "切換至穩定版本中...";
        response = await callGemini("gemini-2.0-flash");
      }

      const data = await response.json();
      if (data.error) throw new Error(data.error.message);

      let text = data.candidates[0].content.parts[0].text;
      text = text.replace(/```json|```/g, "").trim();
      const parsed = JSON.parse(text);

      if (!parsed.items || parsed.items.length === 0) {
        throw new Error("未偵測到菜單內容，請重新拍攝清晰的菜單照片。");
      }

      drawTranslations(parsed.items);
      hintMsg.style.display = "block";
      hintMsg.scrollIntoView({ behavior: "smooth", block: "start" });

    } catch (err) {
      errorMsg.textContent = err.message || "翻譯失敗，請確認網路後再試一次。";
      errorMsg.style.display = "block";
      console.error(err);
    } finally {
      btn.disabled = false;
      loading.classList.remove("show");
    }
  }

  function drawTranslations(items) {
    const canvas = document.getElementById("translatedCanvas");
    const ctx = canvas.getContext("2d");
    const imgWidth = canvas.width;
    const imgHeight = canvas.height;

    const fontSize = Math.max(20, Math.min(imgWidth, imgHeight) * 0.025);
    ctx.font = `600 ${fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
    ctx.textBaseline = "middle";
    ctx.textAlign = "center";

    items.forEach(item => {
      const [ymin, xmin, ymax, xmax] = item.box;
      const xPixel = (xmin / 1000) * imgWidth;
      const yPixel = (ymin / 1000) * imgHeight;
      const boxWidth = ((xmax - xmin) / 1000) * imgWidth;
      const boxHeight = ((ymax - ymin) / 1000) * imgHeight;

      const centerX = xPixel + boxWidth / 2;
      const centerY = yPixel + boxHeight / 2;

      const translatedText = item.translated;
      const textMetrics = ctx.measureText(translatedText);
      const textWidth = textMetrics.width;

      const paddingH = fontSize * 0.6;
      const paddingV = fontSize * 0.3;

      // 修正：用 fillRect 取代 roundRect，確保所有手機都支援
      ctx.fillStyle = "rgba(255, 255, 255, 0.88)";
      ctx.fillRect(
        centerX - textWidth / 2 - paddingH,
        centerY - fontSize / 2 - paddingV,
        textWidth + paddingH * 2,
        fontSize + paddingV * 2
      );

      ctx.fillStyle = "#1e40af";
      ctx.fillText(translatedText, centerX, centerY);
    });
  }
</script>
</body>
</html>
