<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>菜單翻譯 Menu Translator</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1a1a1a;
      min-height: 100vh;
      padding: 24px 16px;
      color: #fff;
    }
    .container { max-width: 960px; margin: 0 auto; }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 26px;
      font-weight: 700;
      text-align: center;
      color: #e63946;
      margin-bottom: 4px;
      letter-spacing: 0.05em;
    }
    .subtitle {
      font-size: 13px;
      color: #666;
      text-align: center;
      margin-bottom: 24px;
    }

    /* 語言選擇 */
    .lang-label { font-size: 13px; color: #888; margin-bottom: 8px; }
    .lang-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 20px; }
    .lang-btn {
      padding: 10px 4px;
      border: 1.5px solid #333;
      border-radius: 10px;
      background: #222;
      font-size: 12px;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
      color: #aaa;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .lang-btn.active {
      border-color: #e63946;
      background: #2a0a0d;
      color: #e63946;
      font-weight: 600;
    }
    .flag { font-size: 18px; margin-bottom: 2px; }

    /* 拍照區 */
    .photo-area {
      background: #222;
      border: 2px dashed #444;
      border-radius: 16px;
      padding: 32px 16px;
      text-align: center;
      margin-bottom: 16px;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .photo-area:hover { border-color: #e63946; }
    .photo-area.has-image { border-style: solid; border-color: #e63946; padding: 0; }
    #preview { width: 100%; border-radius: 14px; display: block; }
    #fileInput { display: none; }

    /* 按鈕 */
    .translate-btn {
      width: 100%;
      padding: 16px;
      background: #e63946;
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      font-family: 'Playfair Display', serif;
      cursor: pointer;
      transition: background 0.15s;
      margin-bottom: 20px;
      letter-spacing: 0.05em;
    }
    .translate-btn:hover { background: #c1121f; }
    .translate-btn:disabled { background: #5a1a1a; color: #888; cursor: not-allowed; }

    /* 載入 */
    .loading { text-align: center; padding: 24px; color: #888; display: none; }
    .loading.show { display: block; }
    .spinner {
      width: 28px; height: 28px;
      border: 3px solid #333;
      border-top-color: #e63946;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 錯誤 */
    .error-msg {
      background: #2a0a0d;
      color: #e63946;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 12px;
      display: none;
      border: 1px solid #e63946;
    }
    .error-msg.show { display: block; }

    /* 結果：左右對照 */
    .result-wrapper {
      display: none;
      gap: 16px;
      margin-top: 8px;
    }
    .result-wrapper.show { display: flex; }

    /* 左邊：原始照片 */
    .original-panel {
      flex: 1;
      min-width: 0;
    }
    .panel-label {
      font-size: 12px;
      color: #666;
      text-align: center;
      margin-bottom: 8px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .original-panel img {
      width: 100%;
      border-radius: 12px;
      border: 1px solid #333;
    }

    /* 右邊：翻譯菜單卡 */
    .translated-panel {
      flex: 1;
      min-width: 0;
    }
    .menu-card {
      background: #111;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 20px 16px;
      height: 100%;
    }
    .menu-card-title {
      font-family: 'Playfair Display', serif;
      font-size: 18px;
      font-weight: 700;
      color: #e63946;
      text-align: center;
      margin-bottom: 4px;
      letter-spacing: 0.08em;
    }
    .menu-card-divider {
      border: none;
      border-top: 1px solid #e63946;
      margin: 12px 0;
      opacity: 0.4;
    }
    .menu-item {
      padding: 10px 0;
      border-bottom: 1px solid #2a2a2a;
    }
    .menu-item:last-child { border-bottom: none; }
    .item-original {
      font-size: 11px;
      color: #555;
      margin-bottom: 3px;
    }
    .item-translated {
      font-family: 'Playfair Display', 'Noto Serif TC', serif;
      font-size: 15px;
      font-weight: 600;
      color: #e63946;
      line-height: 1.4;
    }
    .item-desc {
      font-size: 11px;
      color: #666;
      margin-top: 2px;
    }

    /* 手機版：上下排列 */
    @media (max-width: 600px) {
      .result-wrapper { flex-direction: column; }
    }
  </style>
</head>
<body>
<div class="container">
  <h1>🍽️ Menu Translator</h1>
  <p class="subtitle">拍照即可翻譯菜單 · Photo to translate menu</p>

  <p class="lang-label">選擇翻譯語言 / Select Language</p>
  <div class="lang-grid">
    <button class="lang-btn active" data-lang="English"><span class="flag">🇺🇸</span>English</button>
    <button class="lang-btn" data-lang="日本語"><span class="flag">🇯🇵</span>日本語</button>
    <button class="lang-btn" data-lang="한국어"><span class="flag">🇰🇷</span>한국어</button>
    <button class="lang-btn" data-lang="繁體中文"><span class="flag">🇹🇼</span>繁體中文</button>
    <button class="lang-btn" data-lang="Français"><span class="flag">🇫🇷</span>Français</button>
    <button class="lang-btn" data-lang="Español"><span class="flag">🇪🇸</span>Español</button>
    <button class="lang-btn" data-lang="Deutsch"><span class="flag">🇩🇪</span>Deutsch</button>
    <button class="lang-btn" data-lang="ภาษาไทย"><span class="flag">🇹🇭</span>ภาษาไทย</button>
  </div>

  <div class="photo-area" id="photoArea" onclick="document.getElementById('fileInput').click()">
    <div id="placeholder">
      <p style="font-size:44px">📷</p>
      <p style="margin-top:10px;color:#888">點此拍照或選擇圖片</p>
      <p style="font-size:12px;color:#555;margin-top:4px">Tap to take a photo or choose image</p>
    </div>
    <img id="preview" style="display:none" />
  </div>
  <input type="file" id="fileInput" accept="image/*" capture="environment" />

  <div class="error-msg" id="errorMsg"></div>

  <button class="translate-btn" id="translateBtn" onclick="startTranslation()" disabled>
    翻譯菜單 / Translate Menu
  </button>

  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p id="loadingText" style="font-size:14px">AI 辨識菜單中，請稍候…</p>
  </div>

  <!-- 左右對照結果 -->
  <div class="result-wrapper" id="resultWrapper">
    <div class="original-panel">
      <p class="panel-label">原始菜單 Original</p>
      <img id="originalImg" src="" alt="原始菜單" />
    </div>
    <div class="translated-panel">
      <p class="panel-label">翻譯結果 Translation</p>
      <div class="menu-card">
        <p class="menu-card-title">MENU</p>
        <hr class="menu-card-divider">
        <div id="resultContent"></div>
      </div>
    </div>
  </div>
</div>

<script>
  const API_KEY = "AIzaSyDfF2Rzbl-j4rd1SU2SjEd9nBTqwNM_Jlg";

  let selectedLang = "English";
  let imageBase64 = "";
  let imageSrc = "";

  document.querySelectorAll(".lang-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".lang-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      selectedLang = btn.dataset.lang;
    });
  });

  document.getElementById("fileInput").addEventListener("change", function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      imageSrc = e.target.result;
      imageBase64 = imageSrc.split(",")[1];
      const preview = document.getElementById("preview");
      preview.src = imageSrc;
      preview.style.display = "block";
      document.getElementById("placeholder").style.display = "none";
      document.getElementById("photoArea").classList.add("has-image");
      document.getElementById("translateBtn").disabled = false;
      document.getElementById("resultWrapper").classList.remove("show");
      document.getElementById("errorMsg").classList.remove("show");
    };
    reader.readAsDataURL(file);
  });

  async function callGemini(modelName) {
    const prompt = `你是一位專業的餐廳菜單翻譯助手。
請仔細分析這張菜單圖片，找出所有菜色名稱。
請將每道菜翻譯成「${selectedLang}」，並以以下 JSON 格式回應：
{
  "items": [
    {
      "original": "原始菜名",
      "translated": "翻譯後的菜名（${selectedLang}）",
      "description": "簡短食材說明（${selectedLang}，15字以內）"
    }
  ]
}
注意：只回傳 JSON，不要有其他文字。`;

    const response = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${API_KEY}`,
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{
            parts: [
              { text: prompt },
              { inline_data: { mime_type: "image/jpeg", data: imageBase64 } }
            ]
          }],
          generationConfig: { temperature: 0.1 }
        })
      }
    );
    return response;
  }

  async function startTranslation() {
    const btn = document.getElementById("translateBtn");
    const loading = document.getElementById("loading");
    const loadingText = document.getElementById("loadingText");
    const errorMsg = document.getElementById("errorMsg");
    const resultWrapper = document.getElementById("resultWrapper");

    btn.disabled = true;
    loading.classList.add("show");
    errorMsg.classList.remove("show");
    resultWrapper.classList.remove("show");

    try {
      loadingText.textContent = "Gemini 2.5 Flash 翻譯中...";
      let response = await callGemini("gemini-2.5-flash");

      if (!response.ok) {
        loadingText.textContent = "切換至 Gemini 2.5 Pro...";
        response = await callGemini("gemini-2.5-pro");
      }

      const data = await response.json();
      if (data.error) throw new Error(data.error.message);

      let text = data.candidates[0].content.parts[0].text;
      text = text.replace(/```json|```/g, "").trim();
      const parsed = JSON.parse(text);

      if (!parsed.items || parsed.items.length === 0) {
        throw new Error("未偵測到菜單內容，請重新拍攝清晰的菜單照片。");
      }

      document.getElementById("originalImg").src = imageSrc;
      document.getElementById("resultContent").innerHTML = parsed.items.map(item => `
        <div class="menu-item">
          <p class="item-original">${item.original}</p>
          <p class="item-translated">${item.translated}</p>
          <p class="item-desc">${item.description}</p>
        </div>
      `).join("");

      resultWrapper.classList.add("show");
      resultWrapper.scrollIntoView({ behavior: "smooth", block: "start" });

    } catch (err) {
      errorMsg.textContent = err.message || "翻譯失敗，請確認網路後再試一次。";
      errorMsg.classList.add("show");
      console.error(err);
    } finally {
      btn.disabled = false;
      loading.classList.remove("show");
    }
  }
</script>
</body>
</html>
