// ---------------------------------------------------------
// APP LOGIC
// ---------------------------------------------------------
let currentLang = 'en';
let currentCat = 'notice';

function setLang(lang, el) {
  currentLang = lang;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  render();
}

function setCat(cat, el) {
  currentCat = cat;
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

function render() {
  const cat = CATS[currentCat];
  if (!cat) return;
  
  let html = '';
  
  // Render Images with Fallback
  if (cat.images) {
    cat.images.forEach(src => {
      html += `<img class="menu-img" src="${src}" alt="menu" loading="lazy" onerror="this.onerror=null; this.insertAdjacentHTML('afterend', '<div class='error-img'>Image not found</div>'); this.remove();">`;
    });
  }

  // Render Root Items
  if (cat.items) {
    cat.items.forEach(item => {
      html += renderItem(item);
    });
  }

  // Render Sectioned Items
  if (cat.sections) {
    cat.sections.forEach(sec => {
      const title = sec.title[currentLang] || sec.title['en'] || "Section";
      html += `<div class="sec-title">${title}</div>`;
      sec.items.forEach(item => {
        html += renderItem(item);
      });
    });
  }
  
  document.getElementById('mainContent').innerHTML = html;
}

function renderItem(item) {
  // Safe access for translations
  const langData = item.t[currentLang] || item.t['en'] || ["Item", ""];
  const itemName = langData[0];
  const itemDesc = langData[1];
  
  const descHtml = itemDesc ? `<div class="item-desc">${itemDesc}</div>` : '';
  const badgeHtml = item.popular ? `<div class="badge">⭐ POPULAR</div>` : '';
  
  return `
    <div class="item">
      <div class="item-info">
        ${badgeHtml}
        <div class="item-orig">${item.original}</div>
        <div class="item-name">${itemName}</div>
        ${descHtml}
      </div>
      <div class="price">${item.price}</div>
    </div>
  `;
}

// Auto-detect browser language for better UX
function autoDetectLanguage() {
  const navLang = navigator.language.toLowerCase();
  if (navLang.includes('zh')) currentLang = 'zh';
  else if (navLang.includes('ja')) currentLang = 'jp';
  else if (navLang.includes('ko')) currentLang = 'kr';
  else if (navLang.includes('th')) currentLang = 'th';
  else if (navLang.includes('fr')) currentLang = 'fr';
  else if (navLang.includes('es')) currentLang = 'es';
  else if (navLang.includes('de')) currentLang = 'de';
  else currentLang = 'en';

  // Sync the UI button
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('onclick').includes(`'${currentLang}'`));
  });
}

// Initial Run
window.addEventListener('DOMContentLoaded', () => {
  autoDetectLanguage();
  render();
});
