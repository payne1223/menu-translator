<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>菜單翻譯 Menu Translator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f0;
      min-height: 100vh;
      padding: 24px 16px;
      color: #1a1a1a;
    }
    .container { max-width: 480px; margin: 0 auto; }
    h1 { font-size: 22px; font-weight: 600; text-align: center; margin-bottom: 6px; }
    .subtitle { font-size: 13px; color: #888; text-align: center; margin-bottom: 24px; }
    .lang-section { margin-bottom: 20px; }
    .lang-label { font-size: 13px; color: #666; margin-bottom: 8px; }
    .lang-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .lang-btn {
      padding: 8px 4px;
      border: 1.5px solid #ddd;
      border-radius: 10px;
      background: #fff;
      font-size: 12px;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
      color: #333;
    }
    .lang-btn:hover { border-color: #aaa; }
    .lang-btn.active { border-color: #2563eb; background: #eff6ff; color: #2563eb; font-weight: 600; }
    .lang-btn .flag { font-size: 18px; display: block; margin-bottom: 2px; }
    .photo-area {
      background: #fff;
      border: 2px dashed #ddd;
      border-radius: 16px;
      padding: 32px 16px;
      text-align: center;
      margin-bottom: 16px;
      cursor: pointer;
      transition: border-color 0.15s;
      position: relative;
      overflow: hidden;
    }
    .photo-area:hover { border-color: #2563eb; }
    .photo-area.has-image { border-style: solid; border-color: #2563eb; padding: 0; }
    .photo-icon { font-size: 48px; margin-bottom: 12px; }
    .photo-text { font-size: 15px; color: #555; margin-bottom: 4px; }
    .photo-hint { font-size: 12px; color: #aaa; }
    #preview { width: 100%; border-radius: 14px; display: block; }
    #fileInput { display: none; }
    .translate-btn {
      width: 100%;
      padding: 16px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      margin-bottom: 16px;
    }
    .translate-btn:hover { background: #1d4ed8; }
    .translate-btn:disabled { background: #93c5fd; cursor: not-allowed; }
    .result-box { background: #fff; border-radius: 16px; padding: 20px; display: none; }
    .result-box.show { display: block; }
    .result-title { font-size: 13px; font-weight: 600; color: #888; margin-bottom: 14px; letter-spacing: 0.05em; }
    .menu-item { padding: 12px 0; border-bottom: 1px solid #f0f0f0; }
    .menu-item:last-child { border-bottom: none; }
    .item-original { font-size: 13px; color: #aaa; margin-bottom: 3px; }
    .item-translated { font-size: 16px; font-weight: 500; color: #1a1a1a; }
    .item-desc { font-size: 13px; color: #666; margin-top: 3px; }
    .loading { text-align: center; padding: 24px; color: #888; font-size: 14px; display: none; }
    .loading.show { display: block; }
    .spinner {
      width: 28px; height: 28px;
      border: 3px solid #e5e7eb;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-msg {
      background: #fef2f2;
      color: #dc2626;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 12px;
      display: none;
    }
    .error-msg.show { display: block; }
  </style>
</head>
<body>
<div class="container">
  <h1>🍽️ 菜單翻譯</h1>
  <p class="subtitle">拍照即可翻譯菜單 · Photo to translate menu</p>

  <div class="lang-section">
    <p class="lang-label">選擇翻譯語言 / Select language</p>
    <div class="lang-grid">
      <button class="lang-btn active" data-lang="English"><span class="flag">🇺🇸</span>English</button>
      <button class="lang-btn" data-lang="日本語"><span class="flag">🇯🇵</span>日本語</button>
      <button class="lang-btn" data-lang="한국어"><span class="flag">🇰🇷</span>한국어</button>
      <button class="lang-btn" data-lang="繁體中文"><span class="flag">🇹🇼</span>繁體中文</button>
      <button class="lang-btn" data-lang="Français"><span class="flag">🇫🇷</span>Français</button>
      <button class="lang-btn" data-lang="Español"><span class="flag">🇪🇸</span>Español</button>
      <button class="lang-btn" data-lang="Deutsch"><span class="flag">🇩🇪</span>Deutsch</button>
      <button class="lang-btn" data-lang="ภาษาไทย"><span class="flag">🇹🇭</span>ภาษาไทย</button>
    </div>
  </div>

  <div class="photo-area" id="photoArea" onclick="document.getElementById('fileInput').click()">
    <div id="placeholder">
      <div class="photo-icon">📷</div>
      <p class="photo-text">點此拍照或選擇圖片</p>
      <p class="photo-hint">Tap to take a photo or choose image</p>
    </div>
    <img id="preview" style="display:none" />
  </div>
  <input type="file" id="fileInput" accept="image/*" capture="environment" />

  <div class="error-msg" id="errorMsg"></div>

  <button class="translate-btn" id="translateBtn" onclick="translateMenu()" disabled>
    翻譯菜單 / Translate Menu
  </button>

  <div class="loading" id="loading">
    <div class="spinner"></div>
    AI 辨識菜單中，請稍候…
  </div>

  <div class="result-box" id="resultBox">
    <p class="result-title">翻譯結果</p>
    <div id="resultContent"></div>
  </div>
</div>

<script>
  const API_KEY = "AIzaSyB2zYbCUetj8AMfSjf7y7jy7BpMhYg3DtU";

  let selectedLang = "English";
  let imageBase64 = "";

  document.querySelectorAll(".lang-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".lang-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      selectedLang = btn.dataset.lang;
    });
  });

  document.getElementById("fileInput").addEventListener("change", function () {
    const file = this.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function (e) {
      const result = e.target.result;
      imageBase64 = result.split(",")[1];
      const preview = document.getElementById("preview");
      preview.src = result;
      preview.style.display = "block";
      document.getElementById("placeholder").style.display = "none";
      document.getElementById("photoArea").classList.add("has-image");
      document.getElementById("translateBtn").disabled = false;
      document.getElementById("resultBox").classList.remove("show");
      document.getElementById("errorMsg").classList.remove("show");
    };
    reader.readAsDataURL(file);
  });

  async function translateMenu() {
    if (!imageBase64) return;
    const btn = document.getElementById("translateBtn");
    const loading = document.getElementById("loading");
    const resultBox = document.getElementById("resultBox");
    const errorMsg = document.getElementById("errorMsg");

    btn.disabled = true;
    loading.classList.add("show");
    resultBox.classList.remove("show");
    errorMsg.classList.remove("show");

    const prompt = `
你是一位專業的餐廳菜單翻譯助手。
請仔細分析這張菜單圖片，找出所有菜色名稱。
請將每道菜翻譯成「${selectedLang}」，並以以下 JSON 格式回應：
{
  "items": [
    {
      "original": "原始菜名",
      "translated": "翻譯後的菜名（${selectedLang}）",
      "description": "簡短食材說明（${selectedLang}，15字以內）"
    }
  ]
}
注意：只回傳 JSON，不要有其他文字。如果圖片不是菜單，items 回傳空陣列。
    `;

    try {
      const response = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${API_KEY}`,
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: prompt },
                { inline_data: { mime_type: "image/jpeg", data: imageBase64 } }
              ]
            }],
            generationConfig: { temperature: 0.2 }
          })
        }
      );

      const data = await response.json();
      if (data.error) throw new Error(data.error.message);

      let text = data.candidates[0].content.parts[0].text;
      text = text.replace(/```json|```/g, "").trim();
      const parsed = JSON.parse(text);
      renderResult(parsed.items);

    } catch (err) {
      errorMsg.textContent = "翻譯失敗，請確認 API Key 是否正確，或重新拍照試試。";
      errorMsg.classList.add("show");
      console.error(err);
    } finally {
      btn.disabled = false;
      loading.classList.remove("show");
    }
  }

  function renderResult(items) {
    const resultBox = document.getElementById("resultBox");
    const resultContent = document.getElementById("resultContent");
    if (!items || items.length === 0) {
      resultContent.innerHTML = `<p style="color:#888;font-size:14px;text-align:center;padding:12px 0">未偵測到菜單內容，請重新拍攝清晰的菜單照片。</p>`;
    } else {
      resultContent.innerHTML = items.map(item => `
        <div class="menu-item">
          <p class="item-original">${item.original}</p>
          <p class="item-translated">${item.translated}</p>
          <p class="item-desc">${item.description}</p>
        </div>
      `).join("");
    }
    resultBox.classList.add("show");
    resultBox.scrollIntoView({ behavior: "smooth", block: "start" });
  }
</script>
</body>
</html>
